# Compose >=2.24.4. Usar com -p prospero-ci-<run>-<attempt>.
services:
  runner-planilhas:
    image: prospero/runner-planilhas:${PROSPERO_CI_TAG:?Defina uma tag exclusiva para CI}
  front-office:
    image: prospero/front-office:${PROSPERO_CI_TAG:?Defina uma tag exclusiva para CI}
    ports: !override
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
  middle-office:
    # Fase D0 legada não comprova a guarda. A fase RF08e recria somente MO com esta flag true.
    environment:
      MO_RECUSAR_LIQUIDACAO_PENDENTE: ${PROSPERO_CI_GUARDA_LIQUIDACAO:-false}
    image: prospero/middle-office:${PROSPERO_CI_TAG:?Defina uma tag exclusiva para CI}
    ports: !override
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
  matching-engine:
    image: prospero/matching-engine:${PROSPERO_CI_TAG:?Defina uma tag exclusiva para CI}
    ports: !override
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
  back-office:
    environment:
      BO_RELOGIO_HABILITADO: "true"
      # O POST confirma um lote sem corrida com o worker; a prova de recuperação o religa ao recriar BO.
      PROSPERO_LIQUIDACAO_WORKER_HABILITADO: ${PROSPERO_CI_WORKER_LIQUIDACAO:-false}
    image: prospero/back-office:${PROSPERO_CI_TAG:?Defina uma tag exclusiva para CI}
    ports: !override
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
  frontend:
    image: prospero/frontend:${PROSPERO_CI_TAG:?Defina uma tag exclusiva para CI}
    ports: !override
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
  grafana:
    ports: !override
      - target: 3000
        published: "0"
        host_ip: 127.0.0.1
  prometheus:
    ports: !override
      - target: 9090
        published: "0"
        host_ip: 127.0.0.1
  jaeger:
    ports: !override
      - target: 16686
        published: "0"
        host_ip: 127.0.0.1
  loki:
    ports: !override
      - target: 3100
        published: "0"
        host_ip: 127.0.0.1
  otel-collector:
    ports: !override
      - target: 13133
        published: "0"
        host_ip: 127.0.0.1
