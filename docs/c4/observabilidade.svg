#233;tricas</text></g><g class="link" data-entity-1="g" data-entity-2="j" data-uid="lnk13" id="link_g_j"><polygon fill="#181818" points="253.7622,707.434,244.9873,702.9616,248.7692,707.1684,244.5624,710.9503,253.7622,707.434" style="stroke:#181818;stroke-width:1;"/><path d="M658.7848,102.048 C452.5275,122.0965 6,173.0875 6,238.7969 C6,238.7969 6,238.7969 6,569.7969 C6,676.9838 150.6667,701.9502 247.7706,707.1153" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.4165" x="8" y="408.8638">Consulta traces</text></g><g class="link" data-entity-1="g" data-entity-2="l" data-uid="lnk14" id="link_g_l"><polygon fill="#181818" points="798.593,674.2198,808.0518,671.4755,802.4153,670.9964,802.8944,665.3599,798.593,674.2198" style="stroke:#181818;stroke-width:1;"/><path d="M804.006,134.5116 C808.2262,140.1572 812.0347,146.1382 815,152.2969 C831.8946,187.3862 829,199.8522 829,238.7969 C829,238.7969 829,238.7969 829,569.7969 C829,608.7416 836.6877,623.9498 815,656.2969 C810.5227,662.9747 809.4449,665.0683 803.1798,670.3517" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.6802" x="831" y="408.8638">Consulta logs</text></g><rect fill="none" height="75.1875" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="644.5869" x="277.9565" y="749.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="630.4375" x="282.9565" y="767.292">Configura&#231;&#227;o em arquivo n&#227;o comprova sinais recebidos agora nem m&#233;tricas financeiras.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="578.9424" x="282.9565" y="783.5889">M&#233;tricas detalhadas de host/container/DB/Kafka exigem fontes/coletores a definir.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="588.2461" x="282.9565" y="799.8857">Dados ausentes n&#227;o s&#227;o zero; IDs de ordem/conta ficam fora de labels de m&#233;tricas.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="634.5869" x="282.9565" y="816.1826">Traces Jaeger se perdem ao reiniciar; correla&#231;&#227;o detalhada em logs/traces, sem segredos.</text><!--SRC=[TLNTKjj65BxNKvoIope8I49RaJ83DgQX4Bl4pPLdEcjfBI-izeZTbGFjTAOFqJVeHORUPle4VfC-IRzT-Q_CS2Capl_tVUVugzgAiXAanGCtdbmblJ0YyLoJPvgmzrnHeQpClMAJk5jbQc55HMuc2lwaJ4bJePtSian4VbjQRapHPSsMFisKbubNNaiQJ9oqSp5HMXMYaFJl7t-IPIySvMocgcoiAF0XIPb2vQXWfQFQohbodbqIsX2cHAATdnhXBPEeDVmMdnV_m151ifPu62_TsFG7bD9LV9pXSJeOcx51dBrjN4QQIqTVaxSYH-XWT3ay6Xi4rwoCf_Gk1HHMvMw7q53bwEtRrzHbuuKoqhhZu-rc1gWwabg6a0TuQGqRsx49QQcy7dOfU_rg_njqySDeD8mVtuvD9Iks3xzeLG4Xcz5tXtIbJiTc8dm-o-Z0mV_WpI71Qje-66sic_X_3nT2bX8bH-r0iYAaNtonIiJ8c-SZB_bMZSrbm0DHSzPD9MECVZvcQ1d3pcG3d3_aLjGoe_qteU6x9J5wph1TI_GEUlxYZ5v1I2AuR9MedoznRiKKMWIF7FY431WoW0g3HBAnsRJGeJ02LDDY41ENJnA3mPSlZm5WHd7IT9lvbfs4eyiDN4RFsFGgF5fQBb_jx-sbx7MTrD47bRAW0MnIwx7HKb96Zpew6DTek5IBns0JA-FDjh7jSMdHsvOWtyImbwibvIdolkZrpixw_QGxUDz_T_xpzKbla54TCD3KrB_TyEJx7U3eQcbvv_SErTZFi95gyPbtaok9bNGDAZgcGc0dmn0TCg0lm6-yAiBhL1bXSgciGCogVPe7KpWLE1o2QKFFKRBUY6KgTgvHLAjQQhH6gBf6OJV13b8OxEbq9Rtez_i7tMuol3nvVtQ1sUBz6EuTWithVk3quzv-4Z1FBpvUGGzGKsCTOziB3A9d0jCk7gsIa4mSBjuN6H5QF2eK_r5CRqNwuUJy11T2b1t2LPpmFP12Muk_JGu5Tv3tHghsw8IFUDCGV1Ns5YSn2s0554M5KyGeCDNDVJYdKHJ2Bnx9o7Bn9LT0_HGKgK9MDVksGEWDVxKISN4GhjLTWuCPFtUJACu06bk40IktMheLbUvezH-iocp2mXOk16oAha7Ms1Yyjp23gEKLNbQkI5YKddDBNCvLs4913WfGBk0h9wf00w9aAv2_sZ2v9HEthPCb5KLyfHaxd-QhHKrxfscaWEIzAf5j6dS_tP0b48J4okucFH4hDoxU-xP35nw_Gjr7zAxdrY2r5T1HBa9E6xA0tudKxedwbflVNX802k8Zob2qbQWBVkmHWB1MwYLAwu42Nc4lqtPjEmZ73wKihKIZ4VCMxVy0]--></g></svg>