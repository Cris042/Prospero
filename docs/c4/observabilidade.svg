<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="844px" preserveAspectRatio="none" style="width:1331px;height:844px;background:#FFFFFF;" version="1.1" viewBox="0 0 1331 844" width="1331px" zoomAndPan="magnify"><title>Observabilidade &#8212; rotas configuradas e indicadores previstos</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="490.3076" x="355.0962" y="22.9951">Observabilidade &#8212; rotas configuradas e indicadores previstos</text><!--entity ms--><g class="entity" data-entity="ms" data-source-line="6" data-uid="ent0002" id="entity_ms"><rect fill="#F1F1F1" height="117.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="255.2793" x="537.5" y="345.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="106.1963" x="612.0415" y="368.292">&#171;4 Containers&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.2793" x="547.5" y="384.5889">Quatro aplica&#231;&#245;es independentes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.5713" x="547.5" y="400.8857">FO / MO / ME / BO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="547.5" y="417.1826">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.3447" x="547.5" y="433.4795">Quarkus: logs + traces OTLP;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.2246" x="547.5" y="449.7764">endpoint /q/metrics</text></g><!--entity o--><g class="entity" data-entity="o" data-source-line="7" data-uid="ent0003" id="entity_o"><rect fill="#F1F1F1" height="101.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="236.3779" x="516" y="518.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="85.5449" x="591.4165" y="541.292">&#171;Container&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.5332" x="526" y="557.5889">OpenTelemetry Collector</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="216.3779" x="526" y="573.8857">OTLP gRPC :4317 / HTTP :4318</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.665" x="526" y="590.1826">memory_limiter: 96 MiB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.8418" x="526" y="606.4795">batch: 2s / 256 itens</text></g><!--entity j--><g class="entity" data-entity="j" data-source-line="8" data-uid="ent0004" id="entity_j"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="160.3213" x="254" y="674.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="85.5449" x="291.3882" y="697.292">&#171;Container&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.5771" x="264" y="713.5889">Jaeger</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140.3213" x="264" y="729.8857">Traces em mem&#243;ria</text></g><!--entity l--><g class="entity" data-entity="l" data-source-line="9" data-uid="ent0005" id="entity_l"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="135.5615" x="663" y="674.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="85.5449" x="688.0083" y="697.292">&#171;Container&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.3623" x="673" y="713.5889">Loki</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5615" x="673" y="729.8857">Logs em volume</text></g><!--entity p--><g class="entity" data-entity="p" data-source-line="10" data-uid="ent0006" id="entity_p"><rect fill="#F1F1F1" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="203.5244" x="559" y="197.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="85.5449" x="617.9897" y="220.292">&#171;Container&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.1572" x="569" y="236.5889">Prometheus</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.5244" x="569" y="252.8857">Scrape: 15s / quatro alvos</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.8135" x="569" y="269.1826">Reten&#231;&#227;o: 3 dias / volume</text></g><!--entity g--><g class="entity" data-entity="g" data-source-line="11" data-uid="ent0007" id="entity_g"><rect fill="#F1F1F1" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="203.5107" x="659" y="49.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="85.5449" x="717.9829" y="72.292">&#171;Container&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.1436" x="669" y="88.5889">Grafana</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.3984" x="669" y="104.8857">Fontes provisionadas:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.5107" x="669" y="121.1826">Prometheus, Loki e Jaeger</text></g><g class="entity" data-entity="GMN15" data-source-line="20" data-uid="ent0016" id="entity_GMN15"><path d="M129,368.7969 L129,439.3281 A0,0 0 0 0 129,439.3281 L518.6021,439.3281 A0,0 0 0 0 518.6021,439.3281 L518.6021,378.7969 L508.6021,368.7969 L399.6216,368.7969 L574.6517,282.4336 L391.6216,368.7969 L129,368.7969 A0,0 0 0 0 129,368.7969" fill="#DDEEFF" style="stroke:#181818;stroke-width:0.5;"/><path d="M508.6021,368.7969 L508.6021,378.7969 L518.6021,378.7969 L508.6021,368.7969" fill="#DDEEFF" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.6021" x="135" y="385.8638">CONFIGURADO: painel up{job="prospero"}, por servi&#231;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.7041" x="135" y="400.9966">Mede sucesso da coleta, n&#227;o prontid&#227;o financeira.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.0005" x="135" y="416.1294">M&#233;tricas v&#227;o direto ao Prometheus;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.7778" x="135" y="431.2622">Collector n&#227;o possui pipeline de m&#233;tricas.</text></g><g class="entity" data-entity="GMN18" data-source-line="26" data-uid="ent0019" id="entity_GMN18"><path d="M857.5,189.2969 L857.5,290.0938 A0,0 0 0 0 857.5,290.0938 L1324.207,290.0938 A0,0 0 0 0 1324.207,290.0938 L1324.207,199.2969 L1314.207,189.2969 L982.9187,189.2969 L855.1231,134.4392 L974.9187,189.2969 L857.5,189.2969 A0,0 0 0 0 857.5,189.2969" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;"/><path d="M1314.207,189.2969 L1314.207,199.2969 L1324.207,199.2969 L1314.207,189.2969" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.5366" x="863.5" y="206.3638">PLANEJADO &#8212; P06 / RFs / V01</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.2642" x="863.5" y="221.4966">HTTP/JVM e recursos: detalhar s&#233;ries, coletores e pain&#233;is.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.5811" x="863.5" y="236.6294">Kafka/SAGA: lag, outbox, pend&#234;ncias, rejei&#231;&#245;es, reservas.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.4043" x="863.5" y="251.7622">Matching: processamento e fluxo boleta at&#233; neg&#243;cio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.083" x="863.5" y="266.895">BO: idempot&#234;ncia, concilia&#231;&#227;o e liquida&#231;&#227;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.707" x="863.5" y="282.0278">Trace de ordem nos quatro servi&#231;os; quatro dashboards de neg&#243;cio.</text></g><g class="link" data-entity-1="ms" data-entity-2="o" data-uid="lnk8" id="link_ms_o"><polygon fill="#181818" points="642.3418,517.8836,647.8282,509.7044,643.2006,512.9579,639.9471,508.3303,642.3418,517.8836" style="stroke:#181818;stroke-width:1;"/><path d="M652.5559,463.346 C651.3246,469.4016 650.1181,475.4704 649,481.2969 C646.7307,493.1219 645.4641,499.9752 643.3724,511.9728" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.1763" x="651" y="495.3638">Logs / traces OTLP :4317</text></g><g class="link" data-entity-1="o" data-entity-2="j" data-uid="lnk9" id="link_o_j"><polygon fill="#181818" points="407.1881,674.1303,417.0362,674.0031,411.7306,672.0408,413.6929,666.7352,407.1881,674.1303" style="stroke:#181818;stroke-width:1;"/><path d="M526.117,619.4231 C486.6411,63