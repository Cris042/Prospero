worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  resolver 127.0.0.11 valid=10s;
  proxy_connect_timeout 3s;
  proxy_read_timeout 10s;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location /servicos/front-office/ {
      set $backend front-office:8080;
      rewrite ^/servicos/front-office/(.*)$ /$1 break;
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
    location /servicos/middle-office/ {
      set $backend middle-office:8080;
      rewrite ^/servicos/middle-office/(.*)$ /$1 break;
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
    location /servicos/matching-engine/ {
      set $backend matching-engine:8080;
      rewrite ^/servicos/matching-engine/(.*)$ /$1 break;
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
    location /servicos/back-office/ {
      set $backend back-office:8080;
      rewrite ^/servicos/back-office/(.*)$ /$1 break;
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
    location /servicos/ { default_type application/json; return 404 '{"erro":"Serviço desconhecido"}'; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
