# Evidência comportamental V01a; relógio e séries inteiramente sintéticos.
rule_files:
- alertas.yml
evaluation_interval: 15s
tests:
- name: 'scrape: normal, pendente, disparado e recuperado'
  interval: 15s
  input_series:
  - series: up{job="prospero",instance="alvo:8080",servico="front-office"}
    values: 1x3 0x7 1x12
  promql_expr_test:
  - expr: count(ALERTS{alertname="ProsperoSemScrape",alertstate="firing"}) or vector(0)
    eval_time: 45s
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="ProsperoSemScrape",alertstate="pending"}) or vector(0)
    eval_time: 1m45s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="ProsperoSemScrape",alertstate="firing"}) or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="ProsperoSemScrape",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
