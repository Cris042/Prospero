quarkus.application.name=front-office
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=64K
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Próspero — front-office
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
# B3: métricas do pool Agroal (conexões ativas, espera e tempo) para a carga e o painel de operação.
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.health.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
# RF01: JWT HS256 local; FO_JWT_JWK é o JWK oct (base64url) da chave externa de >=32 bytes. Escopos no claim groups.
%prod.smallrye.jwt.verify.secretkey=${FO_JWT_JWK}
smallrye.jwt.verify.key-format=JWK_BASE64URL
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=prospero-local
mp.jwt.verify.audiences=prospero-front-office
smallrye.jwt.require.named-principal=false
# Autenticação lazy: falhas 401/403 chegam aos mapeadores Problem Details.
quarkus.http.auth.proactive=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=jwt
prospero.mercado.preparacao.habilitada=${FO_PREPARACAO_HABILITADA:false}
prospero.mercado.idade-maxima=PT24H
prospero.mercado.max-namespaces=50
# RF03 (ADR-011): túnel de ±10% sobre a base (último negócio da sessão ou referência); validado em (0, 50].
prospero.ordens.tunel-percentual=10
# Em teste o Quarkus gera par RSA se não houver key.location; o JWK sintético fica em arquivo.
%test.smallrye.jwt.verify.key.location=jwt-teste.jwk
%test.smallrye.jwt.verify.key-format=JWK
%test.prospero.mercado.preparacao.habilitada=true
%test.prospero.mercado.max-namespaces=3
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.datasource.username=teste
%test.quarkus.datasource.password=teste
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/teste
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.kafka.health.enabled=false
%test.quarkus.otel.sdk.disabled=true
# RF04 (ADR-012): relay da outbox e consumidor de resultados do risco; desligados no perfil de testes.
prospero.mensageria.habilitada=true
%test.prospero.mensageria.habilitada=false

# RF09b: canal de invalidação limitado; sem compressão e sem payload financeiro.
quarkus.websockets-next.server.max-frame-size=1024
quarkus.websockets-next.server.max-message-size=1024
quarkus.websockets-next.server.max-pending-messages=1
quarkus.websockets-next.server.per-message-compression-supported=false
quarkus.websockets-next.server.auto-ping-interval=15s
%test.prospero.atualizacoes.consulta-habilitada=false

# RF10 (ADR-013, D4): interruptor só de novas operações de cancelamento; as já persistidas seguem. Desligado por padrão
# até FO, MO, ME e BO terem os leitores v5; o compose local liga porque constrói os quatro juntos.
prospero.cancelamento.emissao-habilitada=${FO_CANCELAMENTO_EMISSAO_HABILITADA:false}
%test.prospero.cancelamento.emissao-habilitada=true
# ADR-018: sinal após commit; false mantém somente polling de recuperação de 200ms.
prospero.outbox.urgencia.habilitada=${PROSPERO_OUTBOX_URGENCIA:true}
