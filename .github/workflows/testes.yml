# Actions fixadas por commit; runner hospedado gratuito do GitHub (repositório público), VM efêmera por job.
name: Próspero — Testes
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: prospero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prospero-testes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      SHA_AVALIADO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - name: Obter o commit avaliado
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Preparar Node 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Testes — checks determinísticos
      run: bash scripts/ci-testes.sh
    - name: Registrar escopo e resultado
      if: always()
      run: 'printf ''%s\n'' "Commit avaliado: $SHA_AVALIADO" "Resultados e limitações estão nos logs dos passos
        anteriores. Uma etapa não executada não constitui aprovação." >> "$GITHUB_STEP_SUMMARY"'
  comentar-testes:
    needs: prospero-testes
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Atualizar comentário em pt-BR sem checkout do PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RESULTADO_CHECK: ${{ needs.prospero-testes.result }}
        SHA_AVALIADO: ${{ github.event.pull_request.head.sha }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const allowed = new Set(['success', 'failure', 'cancelled', 'skipped']);\nconst result = process.env.RESULTADO_CHECK;\n\
          if (!allowed.has(result)) throw new Error('Resultado de check desconhecido.');\nconst pr = context.payload.pull_request;\n\
          if (!pr || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;\nconst current\
          \ = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });\nif (current.data.head.sha\
          \ !== process.env.SHA_AVALIADO) return;\nconst labels = { success: 'Aprovado pelos checks executados',\
          \ failure: 'Falha: correção ou investigação necessária', cancelled: 'Cancelado: verificação incompleta',\
          \ skipped: 'Não executado: verificação incompleta' };\nconst marker = '<!-- prospero:testes -->';\nconst\
          \ link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;\n\
          const body = [marker, '## Resultado da verificação', '', '**Resultado:** ' + labels[result] + '.', '',\
          \ '**Commit avaliado:** ' + process.env.SHA_AVALIADO, '', '[Comandos, resultados e achados da execução]('\
          \ + link + '). A decisão de merge permanece com o usuário.'].join('\\n');\nconst comments = await github.paginate(github.rest.issues.listComments,\
          \ { ...context.repo, issue_number: pr.number, per_page: 100 });\nconst previous = comments.find(c => c.user?.login\
          \ === 'github-actions[bot]' && c.body?.includes(marker));\nif (previous) {\n  await github.rest.issues.updateComment({\
          \ ...context.repo, comment_id: previous.id, body });\n} else {\n  await github.rest.issues.createComment({\
          \ ...context.repo, issue_number: pr.number, body });\n}\n"
